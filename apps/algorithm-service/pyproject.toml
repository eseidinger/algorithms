[project]
name = "algorithm-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emanuel Seidinger", email = "dev@eseidinger.de" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "algorithm-lab",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
algorithm-service = "algorithm_service:main"
algorithm-worker = "algorithm_service.worker_cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
algorithm-lab = { workspace = true }
