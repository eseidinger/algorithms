[project]
name = "algorithm-lab-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/algorithms",
    "apps/algorithm-service",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/algorithm-service/tests", "packages/algorithms"]
addopts = "-m 'not integration'"
markers = ["integration: isolated PostgreSQL tests requiring Docker"]

[tool.mypy]
plugins = ["pydantic.mypy"]
